services:
  rag-api:
    environment:
      EMBEDDING_DEVICE: cuda
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-256}
      RERANKER_DEVICE: cuda

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
