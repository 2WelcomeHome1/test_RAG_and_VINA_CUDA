services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-api:local
    container_name: rag-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-rag-documents}
      S3_REGION: us-east-1
      S3_ADDRESSING_STYLE: path
      HF_HOME: /home/rag/.cache/huggingface
      EMBEDDING_PROVIDER: sentence-transformers
      RETRIEVER_MODEL: ${RETRIEVER_MODEL:-deepvk/USER-bge-m3}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-128}
      RERANKER_PROVIDER: cross-encoder
      RERANKER_MODEL: ${RERANKER_MODEL:-qilowoq/bge-reranker-v2-m3-en-ru}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-64}
      ANSWER_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      LLM_MODEL: ${LLM_MODEL:-qwen3.8:27b-mtp-q4_K_M}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-4}
      LLM_QUEUE_TIMEOUT: ${LLM_QUEUE_TIMEOUT:-30}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-16384}
      LLM_NUM_PREDICT: ${LLM_NUM_PREDICT:-2048}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${RAG_API_PORT:-8000}:8000"
    init: true
    volumes:
      - hf-cache:/home/rag/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 300s

  ollama:
    # Pin the version the model was checked with; MTP models need a recent Ollama.
    image: ollama/ollama:0.34.0
    restart: unless-stopped
    environment:
      # Parallel generations per model: the API never sends more than LLM_MAX_CONCURRENCY at once.
      OLLAMA_NUM_PARALLEL: ${LLM_MAX_CONCURRENCY:-4}
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # minio/minio is no longer published on Docker Hub/quay.io; this is the same 2025-04-22 release.
    image: bitnamilegacy/minio:2025.4.22
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  minio-data:
  hf-cache:
  ollama-models:
